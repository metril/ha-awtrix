name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest pytest-asyncio aiohttp
      - run: python -m pytest -q tests

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  release:
    runs-on: ubuntu-latest
    needs: [tests, hassfest]
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          VERSION=$(jq -r .version custom_components/awtrix/manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo exists=true >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION already exists, skipping."
          else
            echo exists=false >> "$GITHUB_OUTPUT"
          fi

      - name: Create zip
        if: steps.check.outputs.exists == 'false'
        run: |
          cd custom_components/awtrix && zip -r ../../awtrix.zip . -x '*/__pycache__/*' '*.pyc'

      - name: Create release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" awtrix.zip --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
